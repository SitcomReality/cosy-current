<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Browser Game</title>

    <!-- JS libraries -->
    <script src="jquery-3.6.0.min.js"></script>

    <!-- Modular CSS -->
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/layout.css" rel="stylesheet" />
    <link href="styles/effects.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />

    <!-- App entrypoint (ES module) -->
    <script type="module" src="main.js"></script>

    <!-- Legacy noise scripts still used by older game logic -->
    <script src="reality_noise.js"></script>
    <script src="old_noise.js"></script>
  </head>
  <body>
    <div class="topbar menu">
      <div class="menu-item">Player scores/funds</div>
      <div class="menu-item">Stats/History</div>
      <div class="menu-item">Current Gamestate</div>

      <div class="menu-item" id="game_dt">_</div>
      <div class="menu-item" id="game_fps">_</div>
      <div class="menu-item" id="game_score">_</div>
    </div>

    <div id="nojs" onload="removePreLoadWarning()" style="height:400px;background:#F00;">
      javascript disabled
    </div>

    <div id="game_container">
      <div id="gamefield">
        <div id="maptiles">
          <div class="tr" data-r="0" id="tr0">
            <div class="tc" data-c="0">
              <div class="actor npc" id="an1000">!</div>
            </div>
          </div>
        </div>

        <div id="mapoverlay">
          <div id="top_layer_effects">
            <div id="cloudlayer">
            </div>
          </div>
        </div>

        <div id="gamecover" class="cover_closed">
        </div>
      </div>

      <div id="minimap_container">
        <div id="minimap">
          <mr>
            <!--<m class="m0"></m><m class="m1"></m><m class="m2"></m><m class="m3"></m><m class="m4"></m><m class="m5"></m><m class="m6"></m><m class="m7"></m><m class="m8"></m>-->
          </mr>
        </div>
        <div id="minimap_hud" class="menu">
          <div class="menu-section">
            <button id="btn_generatemap" type="button" class="btn btn-primary btn-lg">Generate Map</button>
            <br />
            <label for="mm_width" class="form-label">Minimap Width</label>
            <input id="mm_width" class="form-input" type="text" placeholder="100" aria-label="100" value="100" data-mvar="mm_width">
            <label for="mm_height" class="form-label">Minimap Height</label>
            <input id="mm_height" class="form-input" type="text" placeholder="100" aria-label="100" value="100" data-mvar="mm_height">
          </div>          
          <div class="menu-section">
            <label for="mm_smoothing" class="form-label">Smoothing</label>
            <input id="mm_smoothing" class="form-input" type="text" placeholder="1" aria-label="1" value="1" data-mvar="mm_smoothing">
            <label for="mm_smoothing_passes" class="form-label">Smoothing Passes</label>
            <input id="mm_smoothing_passes" class="form-input" type="text" placeholder="1" aria-label="1" value="1" data-mvar="mm_smoothing_passes">
          </div>
          
          <div class="menu-section">
            <label for="mm_sine1_offset" class="form-label">sine1 offset</label>
            <input id="mm_sine1_offset" class="form-input" type="text" placeholder="107" aria-label="107" value="107" data-mvar="mm_sine1_offset">
            <label for="mm_sine1_scalex" class="form-label">sine1 scalex</label>
            <input id="mm_sine1_scalex" class="form-input" type="text" placeholder="239" aria-label="239" value="239" data-mvar="mm_sine1_scalex">
            <label for="mm_sine1_scaley" class="form-label">sine1 scaley</label>
            <input id="mm_sine1_scaley" class="form-input" type="text" placeholder="457" aria-label="457" value="457" data-mvar="mm_sine1_scaley">
            <label for="sine1_weight" class="form-label">sine1 weight</label>
            <input id="sine1_weight" class="form-input" type="text" placeholder="1.5" aria-label="1.5" value="1.5" data-mvar="sine1_weight">
          </div>
          <div class="menu-section">
            <label for="mm_sine2_offset" class="form-label">sine2 offset</label>
            <input id="mm_sine2_offset" class="form-input" type="text" placeholder="-1001" aria-label="-1001" value="-1001" data-mvar="mm_sine1_offset">
            <label for="mm_sine2_scalex" class="form-label">sine2 scalex</label>
            <input id="mm_sine2_scalex" class="form-input" type="text" placeholder="619" aria-label="619" value="619" data-mvar="mm_sine1_scalex">
            <label for="mm_sine2_scaley" class="form-label">sine2 scaley</label>
            <input id="mm_sine2_scaley" class="form-input" type="text" placeholder="739" aria-label="739" value="739" data-mvar="mm_sine1_scaley">
            <label for="sine2_weight" class="form-label">sine2 weight</label>
            <input id="sine2_weight" class="form-input" type="text" placeholder="1" aria-label="1" value="1" data-mvar="sine2_weight">
          </div>
          
          <div class="menu-section">
            <label for="mm_permute1_scalex" class="form-label">permute1 scalex</label>
            <input id="mm_permute1_scalex" class="form-input" type="text" placeholder="197" aria-label="197" value="197" data-mvar="mm_permute1_scalex">
            <label for="mm_permute1_scaley" class="form-label">permute1 scalex</label>
            <input id="mm_permute1_scaley" class="form-input" type="text" placeholder="379" aria-label="379" value="379" data-mvar="mm_permute1_scaley">
            <label for="mm_permute1_weight" class="form-label">permute1 weight</label>
            <input id="mm_permute1_weight" class="form-input" type="text" placeholder="0.5" aria-label="0.5" value="0.5" data-mvar="mm_permute1_weight">
          </div>
          
          <div class="menu-section">
            <label for="mm_permute2_phase" class="form-label">permute2 phase</label>
            <input id="mm_permute2_phase" class="form-input" type="text" placeholder="3000" aria-label="3000" value="3000" data-mvar="mm_permute2_phase">
            <label for="mm_permute2_amplitude" class="form-label">permute2 amplitude</label>
            <input id="mm_permute2_amplitude" class="form-input" type="text" placeholder="2000" aria-label="2000" value="2000" data-mvar="mm_permute2_amplitude">
            <label for="mm_permute2_period" class="form-label">permute2 period</label>
            <input id="mm_permute2_period" class="form-input" type="text" placeholder="380" aria-label="380" value="380" data-mvar="mm_permute2_period">
            <label for="mm_permute2_wobble" class="form-label">permute2 wobble</label>
            <input id="mm_permute2_wobble" class="form-input" type="text" placeholder="1.23" aria-label="1.23" value="1.23" data-mvar="mm_permute2_wobble">
            <label for="mm_permute2_weight" class="form-label">permute2 weight</label>
            <input id="mm_permute2_weight" class="form-input" type="text" placeholder="0.7" aria-label="0.7" value="0.7" data-mvar="mm_permute2_weight">
          </div>
          
          <div class="menu-section">
            <label for="mm_permute3_phase" class="form-label">permute3 phase</label>
            <input id="mm_permute3_phase" class="form-input" type="text" placeholder="220" aria-label="220" value="220" data-mvar="mm_permute3_phase">
            <label for="mm_permute3_amplitude" class="form-label">permute3 amplitude</label>
            <input id="mm_permute3_amplitude" class="form-input" type="text" placeholder="400" aria-label="400" value="400" data-mvar="mm_permute3_amplitude">
            <label for="mm_permute3_period" class="form-label">permute3 period</label>
            <input id="mm_permute3_period" class="form-input" type="text" placeholder="127" aria-label="127" value="127" data-mvar="mm_permute3_period">
            <label for="mm_permute3_wobble" class="form-label">permute3 wobble</label>
            <input id="mm_permute3_wobble" class="form-input" type="text" placeholder="20" aria-label="20" value="20" data-mvar="mm_permute3_wobble">
            <label for="mm_permute3_weight" class="form-label">permute3 weight</label>
            <input id="mm_permute3_weight" class="form-input" type="text" placeholder="1" aria-label="1" value="1" data-mvar="mm_permute3_weight">
          </div>
        </div>
      </div>

      <div id="gamehud" class="">
        <div class="menu">
          <div class="menu-section">
            <button id="btn_initgame" type="button" class="btn btn-primary btn-lg">Init</button>
          </div>
          <div class="menu-section">
            <button id="btn_startpause" type="button" class="btn btn-primary btn-lg">START</button>
            <button id="btn_startauto" type="button" class="btn btn-primary btn-lg">Start Automode</button>
          </div>
          <div class="menu-section">
            <label for="set_simspeed" class="form-label">Simulation Speed</label>
            <input type="range" class="form-range" min="0" max="10" step="1" id="set_simspeed">
          </div>
          <div class="menu-section">
            <label for="set_seed" class="form-label">Seed</label>
            <input id="set_seed" class="form-input" type="text" placeholder="Seed" aria-label="Seed">
          </div>
        </div>

        <div id="gamecontrols" class="menu">
          <button type="button" class="btn btn-outline-primary btn_move" data-dir="left">&lt;</button>
          <button type="button" class="btn btn-outline-primary btn_move" data-dir="right">&gt;</button>
          <button type="button" class="btn btn-outline-primary btn_move" data-dir="up">^</button>
          <button type="button" class="btn btn-outline-primary btn_move" data-dir="down">v</button>   
        </div>
      </div>
    </div>

    <!-- Page wiring moved to external script for modularity -->
    <script src="page-init.js"></script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
