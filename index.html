<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Cosy Current</title>
    
    <!-- Modular CSS -->
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/layout.css" rel="stylesheet" />
    <link href="styles/effects.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <!-- Rigid, condensed display font -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- App entrypoint (ES module) -->
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="main-canvas"></canvas>
      
      <div id="ui-layer">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active-flex">
          <div class="title-container">
            <h1 class="game-title">Cosy Current</h1>
            <p class="game-subtitle">A gentle river-world simulator</p>
          </div>
          <div class="start-actions">
            <!-- Loading placeholder shown until we decide New Journey / Continue Journey label -->
            <div id="start-loading" class="start-loading">Loading…</div>

            <button id="btn-start" class="btn-large pulse hidden">Initialize World</button>
            <button id="btn-delete-save" class="btn-text hidden">Delete Save Data</button>
          </div>

          <div class="splash-credit">
            <div class="credit-line">A ripple from</div>
            <a href="https://websim.com/@SitcomReality/" target="_blank" rel="noopener noreferrer" title="SitcomReality">
              <img src="sitcomreality.png" alt="SitcomReality" title="SitcomReality" width="250" height="70">
            </a>
          </div>

          <div class="version">v0.2.0 Alpha</div>
        </div>

        <!-- In-Game HUD -->
        <div id="game-hud" class="screen">
          <div class="hud-bar top-bar">
            <!-- Resources -->
            <div class="stat-group">
              <span class="stat-label">SCRAP</span>
              <span class="stat-value" id="ui-scrap">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-group">
              <span class="stat-label">FUEL</span>
              <span class="stat-value" id="ui-fuel">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-group">
              <span class="stat-label">BIO</span>
              <span class="stat-value" id="ui-bio">0</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-group">
              <span class="stat-label">TIME</span>
              <span class="stat-value" id="ui-time">00:00</span>
            </div>
          </div>

          <div class="hud-bar bottom-bar">
            <div class="controls-hint">
              <span class="key">A</span><span class="key">D</span>
              <span>to steer</span>
            </div>

            <!-- Speed-up control: hold Numpad / or press this button -->
            <button id="btn-speed" class="btn-icon" aria-label="Speed x10" title="Hold Numpad / or press to turbo">
              <span style="font-weight:700;font-size:0.95rem;">x10</span>
            </button>

            <!-- Test controls -->
            <button id="btn-stopstart" class="btn-icon" aria-label="Stop / Start" title="Stop or resume raft">
              <span style="font-weight:700;font-size:0.95rem;">STOP</span>
            </button>

            <button id="btn-dayspeed" class="btn-icon" aria-label="Day Speed" title="Toggle fast day/night speed">
              <span style="font-weight:700;font-size:0.95rem;">DAY×</span>
            </button>

            <button id="btn-settings-toggle" class="btn-icon" aria-label="Settings">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </div>

          <!-- Settings Modal -->
          <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
              <div class="modal-header">
                <h2>Generation Settings</h2>
                <button id="btn-close-settings" class="btn-close">&times;</button>
              </div>
              <div id="settings-controls-container" class="modal-body">
                <!-- Controls injected by JS -->
              </div>
            </div>
          </div>

          <!-- Inventory Modal -->
          <div id="inventory-modal" class="modal hidden">
            <div class="modal-content">
              <div class="modal-header">
                <h2>Inventory</h2>
                <button id="btn-close-inventory" class="btn-close">&times;</button>
              </div>
              <div id="inventory-grid" class="modal-body inventory-grid">
                <!-- Items injected by JS -->
              </div>
            </div>
          </div>

          <!-- Collection Modal (Sticker Book) -->
          <div id="collection-modal" class="modal hidden">
            <div class="modal-content collection-modal-content">
              <div class="modal-header">
                <h2>Collection</h2>
                <button id="btn-close-collection" class="btn-close">&times;</button>
              </div>
              <div id="collection-tabs" class="collection-tabs">
                <!-- Tabs injected by JS -->
              </div>
              <div id="collection-grid" class="modal-body collection-grid">
                <!-- Items injected by JS -->
              </div>
            </div>
          </div>

          <!-- Notification Toast -->
          <div id="notification-container" class="notification-container">
            <!-- Toasts injected by JS -->
          </div>
        </div>
      </div>
    </div>

</body>
</html>
